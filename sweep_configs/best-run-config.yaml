# Stage 5: the best LEConv configuration from the earlier stages, re-run on residue graphs without
# ECFP fusion and with both weight initialisations (grid search, 2 runs). Its output is saved in
# notebooks/03_residue_gnn.ipynb.
method: grid
name: best-config-gnn+weight_init
run_cap: 2
metric:
  goal: maximize
  name: R2

parameters:
  # Searched
  weight_init:             # "zero_grad" = PyTorch/PyG default; "kaiming" = Kaiming uniform
    values: [zero_grad, kaiming]

  # Fixed
  gnn_type:
    value: leconv
  architecture:            # GNN layer widths
    value: "128_64_128"
  mlp_architecture:        # MLP-head hidden widths
    value: "128_64_32"
  fingerprint_type:        # "none" = residue graph only (no ECFP fusion)
    value: "none"
  batch_size:
    value: 128
  epochs:
    value: 200
  learning_rate:
    value: 0.0000806404164017702
  weight_decay:
    value: 0.0000976083118843266
  optimizer:
    value: nadam
  activation:
    value: relu
  dropout:
    value: 0
  early_stopping:
    value: false
  patience:
    value: 0
  min_delta:
    value: 0

  # Operator-specific settings (unused by LEConv)
  attention_heads_l1:      # heads per GNN layer for the attention operators
    value: 0
  attention_heads_l2:
    value: 0
  attention_heads_l3:
    value: 0
  K_hops:                  # ChebConv, SGConv, TAGConv, SSGConv
    value: 2
  arma_num_stacks:         # ARMAConv
    value: 1
  arma_num_layers:
    value: 1
  ssg_alpha:               # SSGConv teleport probability
    value: 0.1
